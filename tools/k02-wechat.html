  <section class="tool-head">
    <div>
      <h1>公众号排版</h1>
      <div class="en">WECHAT PUBLISHER</div>
      <p class="desc">为 Obsidian / Typora / 笔记台里写好的 Markdown 排版：一键转成公众号兼容的富文本（<b>行内样式直出</b>，粘贴到公众号编辑器即可），支持代码高亮、表格、引用与公式。</p>
    </div>
    <div class="meta">
      <span class="chip green">K-02 · 传</span>

    <div class="tool-actions" style="margin-bottom:14px">

        <div class="pane-box pad-0"><div class="wechat-frame" id="preview"></div></div>
      </div>
    </div>
