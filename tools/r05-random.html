<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随机化设计 R-05 · 格物 GEWU</title>
<meta name="description" content="可复现的种子随机数、随机抽样与均衡分组——实验随机化的公平性保障。纯前端。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C03A22'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23FBF8EF' font-family='serif'%3E格%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/base.css">
</head>
<body data-page="R">

<div id="site-header"></div>

<main class="tool-wrap">
  <nav class="crumbs"><a href="../index.html">格物</a> / <a href="../index.html#cat-R">研 · 科研</a> / <span>R-05 随机化设计</span></nav>
  <section class="tool-head">
    <div>
      <h1>随机化设计</h1>
      <div class="en">RANDOMIZER</div>
      <p class="desc">实验随机化的三件套：随机数、随机抽样、均衡分组。所有结果由<b>种子（seed）</b>驱动——同一种子必得同一结果，可写入论文方法部分供复现。</p>
    </div>
    <div class="meta">
      <span class="chip accent">R-05 · 研</span>
      <span class="chip">可复现 · 种子驱动</span>
      <span class="chip">导出分组 CSV</span>
    </div>
  </section>

  <section class="tool-body">
    <div class="tool-actions" style="margin-bottom:14px">
      <button class="btn sm ghost mode-btn on" data-mode="num">随机数</button>
      <button class="btn sm ghost mode-btn" data-mode="sample">随机抽样</button>
      <button class="btn sm ghost mode-btn" data-mode="group">均衡分组</button>
      <span class="chip" style="margin-left:auto">种子 = 复现实验的钥匙</span>
    </div>

    <div class="tool-split">
      <div class="pane">
        <div class="form-row">
          <div class="field grow">
            <label for="seed">种子（Seed）</label>
            <input type="text" id="seed" value="42" class="mono-in">
          </div>
          <button class="btn sm ghost" id="roll-seed" title="随机掷一个种子">🎲</button>
        </div>

        <!-- 随机数 -->
        <div id="pane-num">
          <div class="form-row">
            <div class="field"><label for="n-num">数量</label><input type="number" id="n-num" value="10" min="1" max="500"></div>
            <div class="field"><label for="n-min">最小值</label><input type="number" id="n-min" value="1" step="any"></div>
            <div class="field"><label for="n-max">最大值</label><input type="number" id="n-max" value="100" step="any"></div>
            <div class="field"><label for="n-dec">小数位</label><input type="number" id="n-dec" value="0" min="0" max="10"></div>
          </div>
        </div>

        <!-- 抽样 -->
        <div id="pane-sample" style="display:none">
          <div class="form-row">
            <div class="field grow"><label for="s-n">抽取个数</label><input type="number" id="s-n" value="5" min="1"></div>
          </div>
          <div class="field">
            <label for="s-list">总体（每行一个，或逗号分隔）</label>
            <textarea id="s-list" class="ta-code" rows="8" placeholder="样本1&#10;样本2&#10;…"></textarea>
          </div>
        </div>

        <!-- 分组 -->
        <div id="pane-group" style="display:none">
          <div class="form-row">
            <div class="field"><label for="g-mode">分组方式</label>
              <select id="g-mode"><option value="count">按组数</option><option value="size">按每组人数</option></select>
            </div>
            <div class="field"><label for="g-n">组数 / 每组人数</label><input type="number" id="g-n" value="2" min="1"></div>
          </div>
          <div class="field">
            <label for="g-list">参与者名单（每行一个）</label>
            <textarea id="g-list" class="ta-code" rows="8" placeholder="张三&#10;李四&#10;王五&#10;…"></textarea>
          </div>
        </div>

        <div class="tool-actions">
          <button class="btn sm" id="run">执行随机化 →</button>
        </div>
        <div class="notice" style="margin-top:10px"><b>说明：</b>采用 mulberry32 种子伪随机算法，非加密用途；用于实验分组时建议每组均衡（人数差 ≤ 1），并记录种子到论文方法节。</div>
      </div>

      <div class="pane">
        <div class="pane-title">结果</div>
        <div id="out" class="pane-box" style="min-height:260px"><span class="muted mono">设置参数后点击「执行随机化」。</span></div>
        <div class="tool-actions">
          <button class="btn sm ghost" id="copy-out">复制结果</button>
          <button class="btn sm ghost" id="dl-csv" style="display:none">下载分组 CSV</button>
        </div>
      </div>
    </div>
  </section>

  <section class="tool-foot">
    <h2>同主题工具</h2>
    <div class="related-grid" id="related"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="../js/catalog.js"></script>
<script src="../js/site.js"></script>
<script src="../js/tools/r05-random.js"></script>
</body>
</html>
