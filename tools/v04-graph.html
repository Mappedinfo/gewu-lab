<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关系图谱 V-04 · 格物 GEWU</title>
<meta name="description" content="边表即点成图：力导向布局、可拖拽节点、有向/无向、按度数着色，导出 PNG。纯前端。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2325548F'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23FBF8EF' font-family='serif'%3E视%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/base.css">
<style>
  #graph { width: 100%; cursor: grab; touch-action: none; }
  #graph:active { cursor: grabbing; }
</style>
</head>
<body data-page="V">

<div id="site-header"></div>

<main class="tool-wrap">
  <nav class="crumbs"><a href="../index.html">格物</a> / <a href="../index.html#cat-V">视 · 可视化</a> / <span>V-04 关系图谱</span></nav>
  <section class="tool-head">
    <div>
      <h1>关系图谱</h1>
      <div class="en">GRAPH VIZ</div>
      <p class="desc">把「谁和谁有关」变成一张可探索的网络图。边表格式：每行 <code>A B</code> 或 <code>A B 权重</code>（逗号/空格/制表符分隔均可）。节点可拖拽，颜色按度数深浅。</p>
    </div>
    <div class="meta">
      <span class="chip blue">V-04 · 视</span>
      <span class="chip">力导向布局</span>
      <span class="chip">有向 / 无向</span>
    </div>
  </section>

  <section class="tool-body">
    <div class="tool-split wider-l">
      <div class="pane">
        <div class="pane-title">边表</div>
        <textarea id="edges" class="ta-code" rows="14" spellcheck="false"
          placeholder="A B&#10;A C&#10;B C 3"></textarea>
        <div class="form-row">
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2)">
            <input type="checkbox" id="directed"> 有向图（显示箭头）
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2)">
            <input type="checkbox" id="labels" checked> 显示标签
          </label>
        </div>
        <div class="tool-actions">
          <button class="btn sm" id="layout">布局 / 重新布局</button>
          <button class="btn sm ghost" id="sample">载入示例</button>
          <button class="btn sm ghost" id="dl-png">下载 PNG ×2</button>
        </div>
        <div class="notice" style="margin-top:10px"><b>交互：</b>拖拽节点调整布局；边支持权重（第三列），权重越大线越粗。</div>
        <div id="stats" class="pane-box" style="margin-top:10px;font-size:.78rem"></div>
      </div>
      <div class="pane">
        <div class="pane-title">图谱</div>
        <div class="pane-box pad-0">
          <canvas id="graph" width="840" height="500"></canvas>
        </div>
      </div>
    </div>
  </section>

  <section class="tool-foot">
    <h2>同主题工具</h2>
    <div class="related-grid" id="related"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="../js/catalog.js"></script>
<script src="../js/site.js"></script>
<script src="../js/tools/v04-graph.js"></script>
</body>
</html>
