<style>
  .slides-stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .slide-frame .md-preview h2 { font-size: 1.45em; }
  .slide-frame .md-preview h3 { font-size: 1.15em; }
  .slide-frame .md-preview li { margin: .35em 0; }
  .slide-counter {
    position: absolute; right: 18px; bottom: 14px;
    font-family: var(--font-mono); font-size: .72rem; color: var(--ink-3);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 12px;
  }
  @media print {
    body > .site-header, body > .site-footer, .tool-actions, .crumbs, .editor-pane, .pane-title, .tool-foot { display: none !important; }
    .slide-frame { display: block !important; page-break-after: always; box-shadow: none; border: none; max-width: none; width: 100%; aspect-ratio: 16 / 9; }
